name: PR Checks

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r homescreen_hero/requirements.txt
          pip install -r homescreen_hero/requirements-dev.txt

      - name: Run tests
        run: pytest --no-cov

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: homescreen-hero-ui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: homescreen-hero-ui

      - name: Run tests
        run: npm run test:run
        working-directory: homescreen-hero-ui
