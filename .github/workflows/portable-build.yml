name: Windows Portable Build

on:
  release:
    types: [published]

permissions:
  contents: write  # Required to upload release assets

jobs:
  build-portable:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build portable package
        shell: pwsh
        working-directory: windows
        run: .\build.ps1 -Version "${{ steps.version.outputs.VERSION }}" -CreateZip

      - name: Upload ZIP to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.version.outputs.VERSION }}" windows/dist/homescreen-hero-portable.zip --clobber
