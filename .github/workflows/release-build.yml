name: Release Build

on:
  push:
    tags:
      - '*.*.*'  # Triggers on 0.3.1, 1.0.0, 1.2.3, etc.

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Write VERSION file from tag
        run: echo "${{ steps.version.outputs.VERSION }}" > VERSION

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            trentferguson/homescreen-hero:${{ steps.version.outputs.VERSION }}
            trentferguson/homescreen-hero:latest
          cache-from: type=registry,ref=trentferguson/homescreen-hero:latest
          cache-to: type=inline
