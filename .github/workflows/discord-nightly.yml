name: Post Nightly Build Update to Discord

on:
  pull_request:
    types: [closed]

jobs:
  notify-nightly:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest

    steps:
      - name: Post merged PR to Discord (Nightly Builds)
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_NIGHTLY_WEBHOOK_URL }}
          embed-title: "🌙 Nightly Build Update"
          embed-description: |
            **${{ github.event.pull_request.title }}**

            ${{ github.event.pull_request.body || '_No description provided._' }}

            **Author:** @${{ github.event.pull_request.user.login }}
          embed-url: ${{ github.event.pull_request.html_url }}
          embed-color: 7506394
          embed-footer-text: "Nightly Build Notes • homescreen-hero"
